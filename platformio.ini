[env:esp32-ESPCAN]
platform = ${common.platform}
board = esp32dev
framework = arduino
extra_scripts = scripts/embed_html.py, scripts/package_release.py
lib_deps = 
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.0
	https://github.com/sijones/ESPAsyncHTTPUpdateServer.git
	https://github.com/theelims/PsychicMqttClient.git
	https://github.com/bblanchon/ArduinoJson.git
	https://github.com/PaulStoffregen/Time.git
	https://github.com/hasenradball/LCD-I2C.git#master
	h2zero/NimBLE-Arduino@^2.2.3
upload_protocol = esptool
monitor_speed = 115200
;upload_port = COM3
;debug_port = COM6
board_build.partitions = partitions_4mb.csv
build_type = release
build_flags = 
	; 1 = errors only on serial. The web UI Logs tab is unaffected (WS_LOG_* always
	; forwards to the browser). Raise to 4 for verbose serial debugging; costs ~33KB flash.
	-DCORE_DEBUG_LEVEL=1
	-D ESPCAN
	-DESPASYNCHTTPUPDATESERVER_DISABLE_FILESYSTEM
	-DFORBIDDEN_GPIO_LIST=\"0,1,3,6,7,8,9,10,11,12,15,34,35,36,37,38,39\"
	; Task stacks, cut to what they were measured using rather than what they
	; were handed. The task table Diag prints reported async_tcp holding 16KB
	; and touching 2,844 bytes of it under web traffic, and loopTask the same
	; 2,844 of its 8KB - together 20KB reserved to serve 5.7KB. On a board with
	; no PSRAM and a measured heap low water of ~1KB, that is not headroom, it
	; is 10KB the device cannot allocate from.
	;
	; The margins left are deliberate, not tight-fitting: handleWSRequest()
	; parses inbound JSON on the async_tcp stack, so a schedule ingest or a
	; config import is heavier than anything measured here. Re-check the table
	; after any change to what runs on either stack - and do not cut either of
	; these on a reading taken before a browser has connected.
	; async_tcp: default is 8192*2, measured use 2,844 B
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	; loopTask: default is 8192, measured use 2,844 B
	-DARDUINO_LOOP_STACK_SIZE=6144
;-DVEDIRECT_RX=33 -DVEDIRECT_TX=32 -DONEWIREPIN=12 -DCAN_TX_PIN=27 -DCAN_RX_PIN=26 -DCAN_EN_PIN=23 -D ESPCAN 

