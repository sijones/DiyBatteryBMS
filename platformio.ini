	https://github.com/bblanchon/ArduinoJson.git
	https://github.com/PaulStoffregen/Time.git
	https://github.com/sijones/MCP_CAN_lib.git
	https://github.com/hasenradball/LCD-I2C.git#master
	h2zero/NimBLE-Arduino@^2.2.3
upload_protocol = esptool
monitor_speed = 115200
;upload_port = COM3
;debug_port = COM6
board_build.partitions = partitions_4mb.csv
build_type = release
build_flags = 
	; 1 = errors only on serial. The web UI Logs tab is unaffected (WS_LOG_* always
	; forwards to the browser). Raise to 4 for verbose serial debugging; costs ~33KB flash.
	-DCORE_DEBUG_LEVEL=1
	-DCAN0_INT=13 
	-DESPASYNCHTTPUPDATESERVER_DISABLE_FILESYSTEM
	-DFORBIDDEN_GPIO_LIST=\"0,1,2,3,6,7,8,9,10,11,12,15,34,35,36,39\"
;-DCAN_BUS_CS_PIN=5 -DVEDIRECT_RX=33 -DVEDIRECT_TX=32 -DONEWIREPIN=12 -DCAN0_INT=13;-DCAN_BUS_CS_PIN=5 -DVEDIRECT_RX=33 -DVEDIRECT_TX=32 -DONEWIREPIN=12 -DCAN0_INT=13

