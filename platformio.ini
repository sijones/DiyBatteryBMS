	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_LOOP_STACK_SIZE=16384
	-D BMS_S3
; -DVEDIRECT_RX=33 -DVEDIRECT_TX=32 -DONEWIREPIN=12 -DCAN_TX_PIN=27 -DCAN_RX_PIN=26 -DCAN_EN_PIN=23 -D ESPCAN

; Same board as esp32s3-ESPCAN, with the PSRAM switched on.
;
; Kept as a separate env rather than flags on the existing one, because PSRAM is
; a property of the module and not of the wiring: an ESP32-S3 without it builds
; and boots from this env and then quietly runs on internal RAM only. Diag prints
; what it actually found at boot, so the log says which you have.
;
; memory_type must match the part. 8MB of in-package PSRAM is the octal variant
; (S3R8), so qio_opi; a 2MB R2 part is quad and needs qio_qspi. The wrong one of
; those two fails silently and you get no PSRAM at all.
;
; What this does and does not buy: large application allocations - JSON
; documents, Strings, the MQTT outbox - spill into PSRAM and stop competing for
; the 320KB of internal RAM. WiFi and lwIP buffers cannot follow them, because
; DMA requires internal memory, so the ~50KB the WiFi driver takes at startup is
; unchanged.
[env:esp32s3-ESPCAN-PSRAM]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = scripts/embed_html.py, scripts/package_release.py
lib_deps =
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.0
	https://github.com/sijones/ESPAsyncHTTPUpdateServer.git
	https://github.com/theelims/PsychicMqttClient.git
	https://github.com/bblanchon/ArduinoJson.git
	https://github.com/PaulStoffregen/Time.git
	https://github.com/hasenradball/LCD-I2C.git#master
	h2zero/NimBLE-Arduino@^2.2.3
upload_protocol = esptool
monitor_speed = 115200
; 16MB flash on the N16R8, and octal PSRAM alongside it
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_type = release
build_flags =
	; 1 = errors only on serial. The web UI Logs tab is unaffected (WS_LOG_* always
	; forwards to the browser). Raise to 4 for verbose serial debugging; costs ~33KB flash.
	-DCORE_DEBUG_LEVEL=1
	-D ESPCAN
	-D ESPCAN_S3
	-DESPASYNCHTTPUPDATESERVER_DISABLE_FILESYSTEM
	-DFORBIDDEN_GPIO_LIST=\"0,46,47,48\"
	-DARDUINO_USB_MODE=1
	; 0, so Serial is UART0 and comes out of the DevKit's UART socket rather than
	; the native USB one. The other S3 envs use 1; this differs deliberately.
	;
	; The native USB port is a poor place to watch a board that reboots. Its CDC
	; device re-enumerates on every reset, so the port disappears and returns
	; after the boot lines have already gone out - three boots were lost that way
	; - and fifteen back-to-back writes overrun its buffer, which is what shredded
	; the task table. UART0 is attached from the first ROM message and stays
	; attached through a reset.
	;
	; The deciding reason is crashes: the IDF panic handler writes its backtrace
	; to the console UART, not to our Serial. On the native port a panic prints
	; where nobody is looking.
	-DARDUINO_USB_CDC_ON_BOOT=0
	; loopTask: 16384 was the S3 default here, measured use 3,036 B. Halved, so
	; 5KB of margin remains. This matters more than the 8MB headline suggests -
	; task stacks come out of INTERNAL RAM, of which this board has ~156KB free,
	; and the task table showed 69KB of it reserved and never touched.
	; async_tcp is deliberately left at its 16384 default until it has been
	; measured under real web traffic on this chip; the idle figure is 796 B and
	; trimming on an idle reading is how you get an overflow months later.
	-DARDUINO_LOOP_STACK_SIZE=8192
	-D BMS_S3
	-DBOARD_HAS_PSRAM

