; XIAO ESP32-S3 + CAN Bus Expansion Board (MCP2515 via SPI)
; SPI pins D8/D9/D10 (GPIO8/9/10) are used by the expansion board - forbidden for other use
; Set CAN_BUS_CS_PIN = 44 (D7) in the web interface
; Available for VE.Direct/OneWire: D0-D6 (GPIO2-7), D6/GPIO43

