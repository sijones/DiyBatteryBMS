; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
#data_dir = ${PROJECT_DIR}/data
src_dir = src

[common]
; One platform for every board. pioarduino is the maintained continuation of
; platform-espressif32: PlatformIO's own is end-of-life at 6.12.0 / Arduino core
; 2.0.17 (IDF 4.4), which is what every env here was really building against -
; the git URL some of them used resolves to that same 6.12.0.
; 55.03.311 = Arduino core 3.3.11 on ESP-IDF 5.5.5. Bump in one place.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env:esp32dev]
platform = ${common.platform}
board = esp32dev
framework = arduino
extra_scripts = scripts/embed_html.py, scripts/package_release.py
lib_deps = 
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.0
	https://github.com/sijones/ESPAsyncHTTPUpdateServer.git
	https://github.com/theelims/PsychicMqttClient.git
	https://github.com/bblanchon/ArduinoJson.git
	https://github.com/PaulStoffregen/Time.git
	https://github.com/sijones/MCP_CAN_lib.git
	https://github.com/hasenradball/LCD-I2C.git#master
	h2zero/NimBLE-Arduino@^2.2.3
upload_protocol = esptool
monitor_speed = 115200
;upload_port = COM3
;debug_port = COM6
board_build.partitions = partitions_4mb.csv
build_type = release
build_flags = 
	; 1 = errors only on serial. The web UI Logs tab is unaffected (WS_LOG_* always
	; forwards to the browser). Raise to 4 for verbose serial debugging; costs ~33KB flash.
	-DCORE_DEBUG_LEVEL=1
	-DCAN0_INT=22 
	-DESPASYNCHTTPUPDATESERVER_DISABLE_FILESYSTEM
	-DFORBIDDEN_GPIO_LIST=\"0,1,3,6,7,8,9,10,11,12,15,34,35,36,39\"
;-DCAN_BUS_CS_PIN=2 -DVEDIRECT_RX=33 -DVEDIRECT_TX=32 -DONEWIREPIN=12 -DCAN0_INT=22
